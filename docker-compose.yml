services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: riot-backend
    env_file:
      - .env
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/hextech-insights (1)
      dockerfile: Dockerfile
    container_name: riot-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
